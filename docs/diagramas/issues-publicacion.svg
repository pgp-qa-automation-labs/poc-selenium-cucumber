<svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="issues-publicacion-title issues-publicacion-desc"><title id="issues-publicacion-title">Cómo se publican los issues</title><desc id="issues-publicacion-desc">Solo los diagnósticos con confianza de al menos 60 % se publican; en dry-run o sin credenciales se guarda una vista previa; si ya existe un issue con la misma huella se comenta, si no se crea con la captura.</desc><defs><marker id="issues-publicacion-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="issues-publicacion-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="issues-publicacion-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker><marker id="issues-publicacion-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(45,49,66,0.45)"/></marker><pattern id="issues-publicacion-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.1)"/></pattern></defs><rect width="1280" height="520" fill="#f5f5f5"/><path d="M260 96 H300" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#issues-publicacion-arrow)"/><path d="M540 96 H600" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#issues-publicacion-arrow)"/><rect x="554" y="72" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="570" y="84" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SÍ</text><path d="M800 96 H860" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#issues-publicacion-arrow)"/><rect x="814" y="72" width="32" height="16" rx="2" fill=