-item="" data-step="6" aria-label="Si no cumple, el escenario queda omitido con el motivo"><path d="M388 640 H144" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#fixture-karate-fixture-karate-arrow-open)"/><rect x="206" y="616" width="124" height="16" rx="2" fill="#f5f5f5"/><text x="268" y="628" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SKIPEXCEPTION</text><text x="268" y="660" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">escenario omitido + motivo</text></g><line x1="40" y1="688" x2="1240" y2="688" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/><text x="40" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><path d="M140 712 H168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fixture-karate-fixture-karate-arrow)"/><text x="180" y="717" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Llamada</text><path d="M268 712 H296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fixture-karate-fixture-karate-arrow)"/><text x="308" y="717" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Respuesta</text><path d="M412 712 H440" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#fixture-karate-fixture-karate-arrow-accent)"/><text x="452" y="717" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Cumple: continúa</text><path d="M604 712 H632" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fixture-karate-fixture-karate-arrow-open)"/><text x="644" y="717" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Omitido (SkipException)</text>
