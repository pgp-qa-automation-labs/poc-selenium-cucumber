<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fixture-karate-title fixture-karate-desc" id="fixture-karate-root">
        <title id="fixture-karate-title">Secuencia del fixture de clientes con Karate</title>
        <desc id="fixture-karate-desc">El paso Given entrega el perfil al fixture, que genera el cliente con Datafaker y lo registra con Karate; si la API cumple el criterio el escenario continúa con Selenium, si no queda omitido con el motivo.</desc>
        <defs>
      <style>#fixture-karate-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #5a6580;
      --color-accent: #bf4520;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 3600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1); }
      #fixture-karate-root { color: var(--color-ink); font-family: var(--font-sans); }
      #fixture-karate-root [data-motion-root] { width: min(100%, 1280px); }
      #fixture-karate-root [data-motion-root] { max-width: 100%; min-width: 0; }
      #fixture-karate-root .diagram-container { width: 100%; overflow-x: auto; }
      #fixture-karate-root .motion-ready [data-motion-item] { opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease); }
      #fixture-karate-root .motion-ready [data-motion-item].is-visible, #fixture-karate-root .motion-ready[data-frame="end"] [data-motion-item], #fixture-karate-root .motion-ready[data-frame="static"] [data-motion-item] { opacity: 1;
      transform: none; }
      #fixture-karate-root .draw-path { fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none; }
      #fixture-karate-root .motion-ready .draw-path.is-visible { animation: draw-path var(--motion-step) linear forwards; }
      #fixture-karate-root .flow-token { opacity: 0; pointer-events: none; }
      #fixture-karate-root .motion-ready.is-playing .flow-token.is-visible { opacity: 1;
      animation: token-flow 3.2s linear 1 forwards; }
      #fixture-karate-root .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible { animation-iteration-count: infinite; }
      #fixture-karate-root to { stroke-dashoffset: 0; }
      #fixture-karate-root 0% { transform: translateX(0); }
      #fixture-karate-root 100% { transform: translateX(240px); }
      #fixture-karate-root [data-motion-controls] { display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule); }
      #fixture-karate-root .motion-ready [data-motion-controls] { display: flex; }
      #fixture-karate-root [data-motion-controls][hidden] { display: none !important; }
      #fixture-karate-root [data-motion-controls] button { min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer; }
      #fixture-karate-root [data-motion-controls] button:hover { border-color: var(--color-accent); }
      #fixture-karate-root [data-motion-controls] button:focus-visible { outline: 3px solid var(--color-accent);
      outline-offset: 2px; }
      #fixture-karate-root [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
      #fixture-karate-root [data-motion-status-visible] { margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono); }
      #fixture-karate-root .sr-only { position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0; }
      #fixture-karate-root noscript p { margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono); }
      #fixture-karate-root html[data-motion="static"] [data-motion-controls], #fixture-karate-root html[data-motion="static"] [data-motion-decorative] { display: none !important; }
      #fixture-karate-root html[data-motion="static"] [data-motion-item] { opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important; }
      #fixture-karate-root html[data-motion="step"] [data-motion-controls], #fixture-karate-root html[data-motion="step"] [data-motion-decorative] { display: none !important; }
      #fixture-karate-root html[data-motion="step"] [data-motion-item] { animation: none !important;
      transition: none !important; }
      #fixture-karate-root [data-motion-item] { opacity: 1 !important; transform: none !important; }
      #fixture-karate-root [data-motion-decorative] { display: none !important; }
      #fixture-karate-root [data-motion-controls] { display: none !important; }
      #fixture-karate-root .diagram-container { overflow-x: visible; }
      #fixture-karate-root [data-motion-controls], #fixture-karate-root [data-motion-decorative] { display: none !important; }
      #fixture-karate-root [data-motion-item] { opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important; }
      #fixture-karate-root .keyboard-help { color: var(--color-muted); font: 500 12px/1.4 var(--font-mono); }</style><marker id="fixture-karate-fixture-karate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fixture-karate-fixture-karate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="fixture-karate-fixture-karate-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fixture-karate-fixture-karate-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
