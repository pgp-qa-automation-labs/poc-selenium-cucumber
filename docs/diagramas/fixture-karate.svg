width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="888" y="82" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Karate</text><text x="888" y="104" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">registrar_cliente</text><line x1="1136" y1="112" x2="1136" y2="676" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/><rect x="1036" y="40" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="1036" y="40" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1136" y="82" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">API backend</text><text x="1136" y="104" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/api/auth/register</text><rect x="388" y="152" width="8" height="488" fill="#f5f5f5"/><rect x="388" y="152" width="8" height="488" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/><g data-motion-item="" data-step="1" aria-label="El paso Given entrega al fixture el perfil de la fila de Examples"><path d="M144 152 H388" fill="none" stroke="#4f5d75" marker-end="url(#fixture-karate-fixture-karate-arrow)"/><rect x="232" y="128" width="68" height="16" rx="2" fill="#f5f5f5"/><text x="266" y="140" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PERFIL</text><text x="268" y="172" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">prepararCliente(perfil)</text></g><g data-motion-item="" data-step="2" aria-label="El fixture obtiene los datos del cliente"><path d="M396 216 H640" fill="none" stroke="#4f5d75" marker-end="url(#fixture-karate-fixture-karate-arrow)"/><rect x="480" y="192" width="76" 