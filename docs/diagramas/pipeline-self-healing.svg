<svg viewBox="0 0 1280 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-self-healing-title pipeline-self-healing-desc"><title id="pipeline-self-healing-title">Pipeline con PR automático</title><desc id="pipeline-self-healing-desc">Compila, ejecuta la regresión con self-healing y, si se reparó un selector por un cambio real del sitio, abre un PR con la corrección; una persona decide si el cambio del front fue intencional para hacer merge o cerrarlo.</desc><defs><marker id="pipeline-self-healing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="pipeline-self-healing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="pipeline-self-healing-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker><marker id="pipeline-self-healing-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(45,49,66,0.45)"/></marker><pattern id="pipeline-self-healing-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.1)"/></pattern></defs><rect width="1280" height="670" fill="#f5f5f5"/><rect x="560" y="332" width="580" height="252" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.2)" stroke-width="0.8" stroke-dasharray="6,3"/><text x="572" y="350" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">REVISIÓN HUMANA</text><path d="M260 96 H300" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pipeline-self-healing-arrow)"/><path d="M500 96 H560" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pipeline-self-healing-arrow)"/><path d="M800 96 H880" fill="none" stroke="#4f