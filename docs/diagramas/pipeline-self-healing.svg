UI', sans-serif" text-anchor="middle">¿El cambio del front</text><text x="980" y="420" fill="#2d3142" font-size="15" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">fue intencional?</text><rect x="580" y="372" width="200" height="64" rx="32" fill="#f5f5f5"/><rect x="580" y="372" width="200" height="64" rx="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/><text x="680" y="410" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Cerrar el PR</text><rect x="890" y="500" width="180" height="64" rx="32" fill="#f5f5f5"/><rect x="890" y="500" width="180" height="64" rx="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/><text x="980" y="538" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Merge</text><line x1="40" y1="614" x2="1240" y2="614" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/><text x="40" y="642" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="140" y="630" width="28" height="16" rx="8" fill="rgba(45,49,66,0.06)" stroke="#4f5d75"/><text x="180" y="643" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Inicio / fin</text><rect x="296" y="630" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142"/><text x="336" y="643" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Paso</text><polygon points="400,638 414,628 428,638 414,648" fill="#ffffff" stroke="#2d3142"/><text x="440" y="643" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Decisión</text><rect x="532" y="630" width="28" height="16" rx="3" fill="rgba(191