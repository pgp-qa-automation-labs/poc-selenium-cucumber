<svg viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-demo-dark-title flujo-demo-dark-desc"><title id="flujo-demo-dark-title">Flujo de la demo del PR automático</title><desc id="flujo-demo-dark-desc">Al ejecutar el workflow, el selector obsoleto no encuentra el botón, Claude lo identifica como un cambio cosmético y la prueba pasa; el framework corrige el selector en HomePage.java y abre un PR, que se revisa y se cierra sin merge.</desc><defs><marker id="flujo-demo-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="flujo-demo-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="flujo-demo-dark-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#bfc0c0"/></marker><marker id="flujo-demo-dark-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(245,245,245,0.45)"/></marker><pattern id="flujo-demo-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.1)"/></pattern></defs><rect width="1280" height="380" fill="#2d3142"/><path d="M240 96 H280" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-demo-dark-arrow)"/><path d="M480 96 H520" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-demo-dark-arrow)"/><path d="M720 96 H760" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#flujo-demo-dark-arrow-accent)"/><path d="M960 96 H1000" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#flujo-demo-dark-arrow-accent)"/><path d="M1110 136 V212" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-demo-dark-arrow)"/><path d="M1000 252 H960" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-demo-dark-arrow)"/><path d="M760 252 H720" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-demo-dark-arrow)"/><path d="M520 252 H484" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-demo-dark-arrow)"/><rect x="40" y="64" width="200" height="64" rx="32" fill="#2d3142"/><rect x="40" y="64" width="200" height="64" rx="32" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="1"/><text x="140" y="94" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Run workflow</text><text x="140" y="114" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">sobre esta rama</text><rect x="280" y="56" width="200" height="80" rx="6" fill="#2d3142"/><rect x="280" y="56" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="380" y="92" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Regresión</text><text x="380" y="114" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">GitHub Actions</text><rect x="520" y="56" width="200" height="80" rx="6" fill="#2d3142"/><rect x="520" y="56" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="620" y="92" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Selector obsoleto</text><text x="620" y="114" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">no encuentra el botón</text><rect x="760" y="56" width="200" height="80" rx="6" fill="#2d3142"/><rect x="760" y="56" width="200" height="80" rx="6" fill="rgba(24