520" y="212" width="200" height="80" rx="6" fill="#2d3142"/><rect x="520" y="212" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="620" y="248" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Revisar el PR</text><text x="620" y="270" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">diff + razón de la IA</text><rect x="240" y="220" width="240" height="64" rx="32" fill="#2d3142"/><rect x="240" y="220" width="240" height="64" rx="32" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="1"/><text x="360" y="250" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Cerrar sin merge</text><text x="360" y="270" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">la rama sigue igual</text><line x1="40" y1="324" x2="1240" y2="324" stroke="rgba(245,245,245,0.1)" stroke-width="0.8"/><text x="40" y="352" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="140" y="340" width="28" height="16" rx="8" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0"/><text x="180" y="353" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Inicio / fin</text><rect x="296" y="340" width="28" height="16" rx="3" fill="#393e53" stroke="#f5f5f5"/><text x="336" y="353" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Paso</text><rect x="400" y="340" width="28" height="16" rx="3" fill="rgba(240,138,89,0.1)" stroke="#f08a59"/><text x="440" y="353" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Consulta a la IA</text></svg>
