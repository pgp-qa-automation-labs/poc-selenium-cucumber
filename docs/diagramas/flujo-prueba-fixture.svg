142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Fin del escenario</text><text x="640" y="594" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cerrar Chrome · reporte</text></g><line x1="40" y1="640" x2="1240" y2="640" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/><text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="140" y="656" width="28" height="16" rx="8" fill="#2d3142" stroke="#4f5d75" fill-opacity="0.05"/><text x="180" y="669" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Inicio / fin</text><rect x="304" y="656" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142"/><text x="344" y="669" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Paso</text><polygon points="412,664 426,654 440,664 426,674" fill="#ffffff" stroke="#2d3142"/><text x="452" y="669" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Decisión</text><rect x="548" y="656" width="28" height="16" rx="3" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/><text x="588" y="669" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Fixture (Karate)</text>
