t="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Inicio</text><text x="150" y="114" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">API despierta · Chrome</text></g><g data-motion-item="" data-step="1" aria-label="Se toma el siguiente paso del escenario"><rect x="320" y="56" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="320" y="56" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="420" y="102" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Siguiente paso</text><text x="420" y="124" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">del escenario</text></g><g data-motion-item="" data-step="2" aria-label="Se decide qué tipo de paso es"><polygon points="540,96 640,44 740,96 640,148" fill="#f5f5f5"/><polygon points="540,96 640,44 740,96 640,148" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="640" y="102" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">¿Tipo de paso?</text></g><g data-motion-item="" data-step="3" aria-label="Un paso de UI busca el elemento con espera explícita y actúa"><rect x="540" y="252" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="540" y="252" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="640" y="298" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Buscar y actuar</text><text x="640" y="320" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">espera explícita</text></g><g data-motion-item="" data-step="3" aria-label="Se valida si el paso fue exitoso"><polygon points="540,420 640,368 740,420 640,472" fill="#f5f5f5"/><polygon points="540,420 640,368 740,420 640,472" fill