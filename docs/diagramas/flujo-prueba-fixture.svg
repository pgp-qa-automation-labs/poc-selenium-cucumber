<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-prueba-fixture-title flujo-prueba-fixture-desc" id="flujo-prueba-fixture-root">
        <title id="flujo-prueba-fixture-title">Flujo de un escenario con fixture</title>
        <desc id="flujo-prueba-fixture-desc">Cada paso de UI busca y valida un elemento; el Given del login llama al fixture con Karate, y si los datos no cumplen el criterio el escenario termina omitido en vez de fallido.</desc>
        <defs>
      <style>#flujo-prueba-fixture-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #5a6580;
      --color-accent: #bf4520;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 3600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1); }
      #flujo-prueba-fixture-root { color: var(--color-ink); font-family: var(--font-sans); }
      #flujo-prueba-fixture-root [data-motion-root] { width: min(100%, 1280px); }
      #flujo-prueba-fixture-root [data-motion-root] { max-width: 100%; min-width: 0; }
      #flujo-prueba-fixture-root .diagram-container { width: 100%; overflow-x: auto; }
      #flujo-prueba-fixture-root .motion-ready [data-motion-item] { opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease); }
      #flujo-prueba-fixture-root .motion-ready [data-motion-item].is-visible, #flujo-prueba-fixture-root .motion-ready[data-frame="end"] [data-motion-item], #flujo-prueba-fixture-root .motion-ready[data-frame="static"] [data-motion-item] { opacity: 1;
      transform: none; }
      #flujo-prueba-fixture-root .draw-path { fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none; }
      #flujo-prueba-fixture-root .motion-ready .draw-path.is-visible { animation: draw-path var(--motion-step) linear forwards; }
      #flujo-prueba-fixture-root .flow-token { opacity: 0; pointer-events: none; }
      #flujo-prueba-fixture-root .motion-ready.is-playing .flow-token.is-visible { opacity: 1;
      animation: token-flow 3.2s linear 1 forwards; }
      #flujo-prueba-fixture-root .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible { animation-iteration-count: infinite; }
      #flujo-prueba-fixture-root to { stroke-dashoffset: 0; }
      #flujo-prueba-fixture-root 0% { transform: translateX(0); }
      #flujo-prueba-fixture-root 100% { transform: translateX(240px); }
      #flujo-prueba-fixture-root [data-motion-controls] { display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule); }
      #flujo-prueba-fixture-root .motion-ready [data-motion-controls] { display: flex; }
      #flujo-prueba-fixture-root [data-motion-controls][hidden] { display: none !important; }
      #flujo-prueba-fixture-root [data-motion-controls] button { min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer; }
      #flujo-prueba-fixture-root [data-motion-controls] button:hover { border-color: var(--color-accent); }
      #flujo-prueba-fixture-root [data-motion-controls] button:focus-visible { outline: 3px solid var(--color-accent);
      outline-offset: 2px; }
      #flujo-prueba-fixture-root [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
      #flujo-prueba-fixture-root [data-motion-status-visible] { margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono); }
      #flujo-prueba-fixture-root .sr-only { position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0; }
      #flujo-prueba-fixture-root noscript p { margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono); }
      #flujo-prueba-fixture-root html[data-motion="static"] [data-motion-controls], #flujo-prueba-fixture-root html[data-motion="static"] [data-motion-decorative] { display: none !important; }
      #flujo-prueba-fixture-root html[data-motion="static"] [data-motion-item] { opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important; }
      #flujo-prueba-fixture-root html[data-motion="step"] [data-motion-controls], #flujo-prueba-fixture-root html[data-motion="step"] [data-motion-decorative] { display: none !important; }
      #flujo-prueba-fixture-root html[data-motion="step"] [data-motion-item] { animation: none !important;
      transition: none !important; }
      #flujo-prueba-fixture-root [data-motion-item] { opacity: 1 !important; transform: none !important; }
      #flujo-prueba-fixture-root [data-motion-decorative] { display: none !important; }
      #flujo-prueba-fixture-root [data-motion-controls] { display: none !important; }
      #flujo-prueba-fixture-root .diagram-container { overflow-x: visible; }
      #flujo-prueba-fixture-root [data-motion-controls], #flujo-prueba-fixture-root [data-motion-decorative] { display: none !important; }
      #flujo-prueba-fixture-root [data-motion-item] { opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important; }
      #flujo-prueba-fixture-root .keyboard-help { color: var(--color-muted); font: 500 12px/1.4 var(--font-mono); }</style><marker id="flujo-prueba-fixture-flujo-prueba-fixture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="flujo-prueba-fixture-flujo-prueba-fixture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="flujo-prueba-fixture-flujo-prueba-fixture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="flujo-prueba-fixture-flujo-prueba-fixture-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
