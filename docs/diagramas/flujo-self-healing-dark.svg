<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-self-healing-dark-title flujo-self-healing-dark-desc"><title id="flujo-self-healing-dark-title">Flujo de un paso con self-healing</title><desc id="flujo-self-healing-dark-desc">Si el selector no encuentra el elemento, el framework revisa si el problema es el selector, envía el HTML reducido a Claude y solo usa el selector nuevo si el cambio es cosmético, la confianza es de al menos 80 % y el elemento es visible y único; si no, el paso falla con el error real.</desc><defs><marker id="flujo-self-healing-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="flujo-self-healing-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="flujo-self-healing-dark-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#bfc0c0"/></marker><marker id="flujo-self-healing-dark-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(245,245,245,0.45)"/></marker><pattern id="flujo-self-healing-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.1)"/></pattern></defs><rect width="1280" height="660" fill="#2d3142"/><path d="M260 96 H300" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-self-healing-dark-arrow)"/><path d="M500 96 H540" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-self-healing-dark-arrow)"/><path d="M740 96 H820" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-self-healing-dark-arrow)"/><rect x="764" y="72" width="32" height="16" rx="2" fill="#2d3142"/><text x="780" y="84" fill="#949eb2" font-size="12" font-family="'Geist Mono', ui-monospac