e53" stroke="#f5f5f5" stroke-width="1"/><text x="640" y="248" fill="#f5f5f5" font-size="15" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">¿El selector aún</text><text x="640" y="268" fill="#f5f5f5" font-size="15" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">ve algo visible?</text><rect x="820" y="212" width="200" height="80" rx="6" fill="#2d3142"/><rect x="820" y="212" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="920" y="248" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Usar selector nuevo</text><text x="920" y="270" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">queda en el reporte</text><rect x="260" y="392" width="200" height="80" rx="6" fill="#2d3142"/><rect x="260" y="392" width="200" height="80" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1.2"/><text x="360" y="428" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Claude · IA</text><text x="360" y="450" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">identifica y clasifica</text><polygon points="520,432 640,372 760,432 640,492" fill="#2d3142"/><polygon points="520,432 640,372 760,432 640,492" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="640" y="428" fill="#f5f5f5" font-size="15" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">¿Cosmético y</text><text x="640" y="448" fill="#f5f5f5" font-size="15" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">