<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-demo-title flujo-demo-desc"><title id="flujo-demo-title">Flujo de la demo del PR automático</title><desc id="flujo-demo-desc">Al ejecutar el workflow, el selector obsoleto no encuentra el botón, Claude lo identifica como un cambio cosmético y la prueba pasa; el framework corrige el selector en HomePage.java y abre un PR, que se revisa y se cierra sin merge.</desc><defs><marker id="flujo-demo-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="flujo-demo-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="flujo-demo-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker><marker id="flujo-demo-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(45,49,66,0.45)"/></marker><pattern id="flujo-demo-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.1)"/></pattern></defs><rect width="1280" height="380" fill="#f5f5f5"/><path d="M240 96 H280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-demo-arrow)"/><path d="M480 96 H520" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-demo-arrow)"/><path d="M720 96 H760" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#flujo-demo-arrow-accent)"/><path d="M960 96 H1000" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#flujo-demo-arrow-accent)"/><path d="M1110 136 V212" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-demo-arrow)"/><path d="M1000 252 H960" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-demo-arrow)"/><path d="M760 252 H720" fill=