<svg viewBox="0 0 1280 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="triage-agente-title triage-agente-desc"><title id="triage-agente-title">Cómo investiga el agente de triage</title><desc id="triage-agente-desc">Los fallos se agrupan por causa; dentro del tope, Claude analiza la evidencia y pide herramientas de solo lectura mientras le falte evidencia, hasta registrar un diagnóstico con categoría y confianza.</desc><defs><marker id="triage-agente-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="triage-agente-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="triage-agente-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker><marker id="triage-agente-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(45,49,66,0.45)"/></marker><pattern id="triage-agente-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.1)"/></pattern></defs><rect width="1280" height="540" fill="#f5f5f5"/><rect x="804" y="24" width="468" height="296" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.2)" stroke-width="0.8" stroke-dasharray="6,3"/><text x="816" y="42" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">BUCLE DEL AGENTE · TOOL USE</text><path d="M260 96 H300" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#triage-agente-arrow)"/><path d="M500 96 H540" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#triage-agente-arrow)"/><path d="M740 96 H820" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#triage-agente-arrow-accent)"/><rect x="764" y="72