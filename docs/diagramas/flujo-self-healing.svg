<svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-self-healing-title flujo-self-healing-desc"><title id="flujo-self-healing-title">Flujo de un paso con self-healing</title><desc id="flujo-self-healing-desc">Si el selector no encuentra el elemento, el framework revisa si el problema es el selector, envía el HTML reducido a Claude y solo usa el selector nuevo si el cambio es cosmético, la confianza es de al menos 80 % y el elemento es visible y único; si no, el paso falla con el error real.</desc><defs><marker id="flujo-self-healing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="flujo-self-healing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="flujo-self-healing-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker><marker id="flujo-self-healing-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(45,49,66,0.45)"/></marker><pattern id="flujo-self-healing-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.1)"/></pattern></defs><rect width="1280" height="660" fill="#f5f5f5"/><path d="M260 96 H300" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-self-healing-arrow)"/><path d="M500 96 H540" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-self-healing-arrow)"/><path d="M740 96 H820" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-self-healing-arrow)"/><rect x="764" y="72" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="780" y="84" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" lett