<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-fixture-title pipeline-fixture-desc" id="pipeline-fixture-root">
        <title id="pipeline-fixture-title">Pipeline de la rama de fixtures</title>
        <desc id="pipeline-fixture-desc">Se lanza con un PR o a mano, prepara Java, ejecuta las pruebas de Selenium y Karate sin pantalla, sube el reporte y termina en verde si no hubo fallas; los escenarios omitidos no cuentan como fallas.</desc>
        <defs>
      <style>#pipeline-fixture-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #5a6580;
      --color-accent: #bf4520;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 3600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1); }
      #pipeline-fixture-root { color: var(--color-ink); font-family: var(--font-sans); }
      #pipeline-fixture-root [data-motion-root] { width: min(100%, 1280px); }
      #pipeline-fixture-root [data-motion-root] { max-width: 100%; min-width: 0; }
      #pipeline-fixture-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-fixture-root .motion-ready [data-motion-item] { opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease); }
      #pipeline-fixture-root .motion-ready [data-motion-item].is-visible, #pipeline-fixture-root .motion-ready[data-frame="end"] [data-motion-item], #pipeline-fixture-root .motion-ready[data-frame="static"] [data-motion-item] { opacity: 1;
      transform: none; }
      #pipeline-fixture-root .draw-path { fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none; }
      #pipeline-fixture-root .motion-ready .draw-path.is-visible { animation: draw-path var(--motion-step) linear forwards; }
      #pipeline-fixture-root .flow-token { opacity: 0; pointer-events: none; }
      #pipeline-fixture-root .motion-ready.is-playing .flow-token.is-visible { opacity: 1;
      animation: token-flow 3.2s linear 1 forwards; }
      #pipeline-fixture-root .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible { animation-iteration-count: infinite; }
      #pipeline-fixture-root to { stroke-dashoffset: 0; }
      #pipeline-fixture-root 0% { transform: translateX(0); }
      #pipeline-fixture-root 100% { transform: translateX(240px); }
      #pipeline-fixture-root [data-motion-controls] { display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule); }
      #pipeline-fixture-root .motion-ready [data-motion-controls] { display: flex; }
      #pipeline-fixture-root [data-motion-controls][hidden] { display: none !important; }
      #pipeline-fixture-root [data-motion-controls] button { min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer; }
      #pipeline-fixture-root [data-motion-controls] button:hover { border-color: var(--color-accent); }
      #pipeline-fixture-root [data-motion-controls] button:focus-visible { outline: 3px solid var(--color-accent);
      outline-offset: 2px; }
      #pipeline-fixture-root [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
      #pipeline-fixture-root [data-motion-status-visible] { margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono); }
      #pipeline-fixture-root .sr-only { position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0; }
      #pipeline-fixture-root noscript p { margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono); }
      #pipeline-fixture-root html[data-motion="static"] [data-motion-controls], #pipeline-fixture-root html[data-motion="static"] [data-motion-decorative] { display: none !important; }
      #pipeline-fixture-root html[data-motion="static"] [data-motion-item] { opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important; }
      #pipeline-fixture-root html[data-motion="step"] [data-motion-controls], #pipeline-fixture-root html[data-motion="step"] [data-motion-decorative] { display: none !important; }
      #pipeline-fixture-root html[data-motion="step"] [data-motion-item] { animation: none !important;
      transition: none !important; }
      #pipeline-fixture-root [data-motion-item] { opacity: 1 !important; transform: none !important; }
      #pipeline-fixture-root [data-motion-decorative] { display: none !important; }
      #pipeline-fixture-root [data-motion-controls] { display: none !important; }
      #pipeline-fixture-root .diagram-container { overflow-x: visible; }
      #pipeline-fixture-root [data-motion-controls], #pipeline-fixture-root [data-motion-decorative] { display: none !important; }
      #pipeline-fixture-root [data-motion-item] { opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important; }
      #pipeline-fixture-root .keyboard-help { color: var(--color-muted); font: 500 12px/1.4 var(--font-mono); }</style><marker id="pipeline-fixture-pipeline-fixture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="pipeline-fixture-pipeline-fixture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="pipeline-fixture-pipeline-fixture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="pipeline-fixture-pipeline-fixture-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
        <rect width="1280" height="470" fill="#f5f5f5"/>
        <path d="M260 96 H300" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pipeline-fixture-pipeline-fixture-arrow)"/><path d="M520 96 H580" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pipeline-fixture-pipeline-fixture-arrow)"/><path d="M840 96 H900" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pipeline-fixture-pipeline-fixture-arrow)"/><path d="M1010 136 V188" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pipeline-fixture-pipeline-fixture-arrow)"/><path d="M1010 292 V332" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#pipeline-fixture-pipeline-fixture-arrow-accent)"/><rect x="1018" y="304" width="36" height="16" rx="2" fill="#f5f5f5"/><text x="1036" y="316" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SÍ</text><path d="M890 240 H800" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#pipeline-fixture-pipeline-fixture-arrow)"/><rect x="827" y="216" width="36" height="16" rx="2" fill="#f5f5f5"/><text x="845" y="228" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><g data-motion-item="" data-step="1" aria-label="Se lanza con un PR o a mano"><rect x="40" y="64" width="220" height="64" rx="32" fill="#f5f5f5"/><rect x="40" y="64" width="220" height="64" rx="32" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><text x="150" y="94" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">PR o a mano</text><text x="150" y="114" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Run workflow</text></g><g data-motion-item="" data-step="2" aria-label="Prepara Java 17 y las dependencias"><rect x="300" y="56" width="220" height="80" rx="6" fill="#f5f5f5"/><rect x="300" y="56" width="220" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="410" y="102" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Preparar entorno</text><text x="410" y="124" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Java 17 · Maven</text></g><g data-motion-item="" data-step="3" aria-label="Ejecuta Selenium y Karate en Chrome sin pantalla"><rect x="580" y="56" width="260" height="80" rx="6" fill="#f5f5f5"/><rect x="580" y="56" width="260" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="710" y="102" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Ejecutar pruebas</text><text x="710" y="124" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Selenium + Karate · headless</text></g><g data-motion-item="" data-step="4" aria-label="Sube el reporte de Cucumber"><rect x="900" y="56" width="220" height="80" rx="6" fill="#f5f5f5"/><rect x="900" y="56" width="220" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1010" y="102" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Subir reporte</text><text x="1010" y="124" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">artefacto cucumber.html</text></g><g data-motion-item="" data-step="5" aria-label="Revisa si las pruebas pasaron"><polygon points="890,240 1010,188 1130,240 1010,292" fill="#f5f5f5"/><polygon points="890,240 1010,188 1130,240 1010,292" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1010" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">¿Pasaron?</text></g><g data-motion-item="" data-step="6" aria-label="Resultado verde o rojo"><rect x="910" y="332" width="200" height="64" rx="32" fill="#f5f5f5"/><rect x="910" y="332" width="200" height="64" rx="32" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><text x="1010" y="362" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Verde</text><text x="1010" y="382" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">omitidos no fallan</text><rect x="600" y="208" width="200" height="64" rx="32" fill="#f5f5f5"/><rect x="600" y="208" width="200" height="64" rx="32" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><text x="700" y="238" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Rojo</text><text x="700" y="258" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">revisar el reporte</text></g><line x1="40" y1="420" x2="1240" y2="420" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/><text x="40" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="140" y="436" width="28" height="16" rx="8" fill="#2d3142" stroke="#4f5d75" fill-opacity="0.05"/><text x="180" y="449" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Inicio / fin</text><rect x="304" y="436" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142"/><text x="344" y="449" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Paso</text><polygon points="412,444 426,434 440,444 426,454" fill="#ffffff" stroke="#2d3142"/><text x="452" y="449" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Decisión</text>
      </svg>
