<svg viewBox="0 0 1280 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-prueba-agentes-title flujo-prueba-agentes-desc"><title id="flujo-prueba-agentes-title">Flujo de un escenario con reintento y evidencia</title><desc id="flujo-prueba-agentes-desc">Cada escenario se ejecuta con self-healing; si pasa, guarda su línea base; si falla, guarda la evidencia y se reintenta una vez; si vuelve a fallar, queda fallido y pasa al agente de triage, y si pasa en el reintento se informa como inestable.</desc><defs><marker id="flujo-prueba-agentes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="flujo-prueba-agentes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="flujo-prueba-agentes-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker><marker id="flujo-prueba-agentes-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(45,49,66,0.45)"/></marker><pattern id="flujo-prueba-agentes-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.1)"/></pattern></defs><rect width="1280" height="540" fill="#f5f5f5"/><path d="M220 96 H260" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-prueba-agentes-arrow)"/><path d="M460 96 H500" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-prueba-agentes-arrow)"/><path d="M720 96 H760" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-prueba-agentes-arrow)"/><path d="M940 96 H980" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#flujo-prueba-agentes-arrow)"/><rect x="944" y="72" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="960" y="84" fill="#5a6580" font-siz