<svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-agentes-dark-title pipeline-agentes-dark-desc"><title id="pipeline-agentes-dark-title">Pipeline con triage e issues</title><desc id="pipeline-agentes-dark-desc">Compila y ejecuta la regresión; si hubo fallos, el triage los investiga y crea los issues en el destino elegido; si hubo una reparación real, abre un PR de corrección que revisa una persona.</desc><defs><marker id="pipeline-agentes-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="pipeline-agentes-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="pipeline-agentes-dark-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#bfc0c0"/></marker><marker id="pipeline-agentes-dark-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(245,245,245,0.45)"/></marker><pattern id="pipeline-agentes-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.1)"/></pattern></defs><rect width="1280" height="520" fill="#2d3142"/><path d="M260 96 H300" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pipeline-agentes-dark-arrow)"/><path d="M500 96 H560" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pipeline-agentes-dark-arrow)"/><path d="M800 96 H880" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#pipeline-agentes-dark-arrow-accent)"/><rect x="808" y="72" width="64" height="16" rx="2" fill="#2d3142"/><text x="840" y="84" fill="#949eb2" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">FALLOS</text><path d="M1080 96 H1120" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#pipeline-agentes-dark-arrow-accent)"/><path d="M400 136 V212" fill="none" stroke="rgba(245,245,245,0.45)" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#pipeline-agentes-dark-arrow-dim)"/><rect x="408" y="166" width="80" height="16" rx="2" fill="#2d3142"/><text x="448" y="178" fill="#949eb2" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">OPCIONAL</text><path d="M680 136 V212" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pipeline-agentes-dark-arrow)"/><rect x="688" y="166" width="96" height="16" rx="2" fill="#2d3142"/><text x="736" y="178" fill="#949eb2" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REPARACIÓN</text><path d="M800 252 H880" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pipeline-agentes-dark-arrow)"/><path d="M680 292 V368" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pipeline-agentes-dark-arrow)"/><rect x="40" y="64" width="220" height="64" rx="32" fill="#2d3142"/><rect x="40" y="64" width="220" height="64" rx="32" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="1"/><text x="150" y="94" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Push, PR o a mano</text><text x="150" y="114" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">también lun–vie</text><rect x="300" y="56" width="200" height="80" rx="6" fill="#2d3142"/><rect x="300" y="56" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="400" y="92" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" tex