space, 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="140" y="480" width="28" height="16" rx="8" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0"/><text x="180" y="493" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Inicio / fin</text><rect x="296" y="480" width="28" height="16" rx="3" fill="#393e53" stroke="#f5f5f5"/><text x="336" y="493" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Paso</text><rect x="400" y="480" width="28" height="16" rx="3" fill="rgba(240,138,89,0.1)" stroke="#f08a59"/><text x="440" y="493" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Agente de IA</text><rect x="556" y="480" width="28" height="16" rx="3" fill="#393e53" stroke="rgba(245,245,245,0.45)" stroke-dasharray="4,3"/><text x="596" y="493" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Opcional</text></svg>
