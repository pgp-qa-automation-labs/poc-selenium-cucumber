nospace" text-anchor="middle" letter-spacing="0.06em">FALLA</text><path d="M640 292 V380" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#pipeline-etapas-fixture-pipeline-etapas-fixture-arrow)"/><g data-motion-item="" data-step="1" aria-label="Se lanza con un PR o a mano"><rect x="40" y="64" width="220" height="64" rx="32" fill="#2d3142"/><rect x="40" y="64" width="220" height="64" rx="32" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.05"/><text x="150" y="94" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">PR o a mano</text><text x="150" y="114" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Run workflow</text></g><g data-motion-item="" data-step="2" aria-label="Etapa 1: compila el framework y las pruebas"><rect x="300" y="56" width="200" height="80" rx="6" fill="#2d3142"/><rect x="300" y="56" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="400" y="102" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">1 · Compilar</text><text x="400" y="124" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mvn test-compile</text></g><g data-motion-item="" data-step="3" aria-label="Etapa 2: prueba por sí sola la API de la que dependen los fixtures"><rect x="560" y="56" width="240" height="80" rx="6" fill="#2d3142"/><rect x="560" y="56" width="240" height="80" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.08"/><text x="680" y="102" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">2 · Pruebas de API</text><text x="680" y="124" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Karate · contrato del registro</text></g><g data-motion-item="" data-step="3" aria-label="Si la API falla, la etapa de UI no se ejecuta"><polygon points="880,96 980,44 1080,96 980,148" fill="#2d3142"/><polygon points="880,96 980,44 1080,96 980,148" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.08"/><text x="980" y="102" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">¿API OK?</text></g><g data-motion-item="" data-step="4" aria-label="Etapa 3: escenarios de UI; cada Given prepara sus datos con Karate"><rect x="860" y="212" width="240" height="80" rx="6" fill="#2d3142"/><rect x="860" y="212" width="240" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="980" y="258" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">3 · UI con fixtures</text><text x="980" y="280" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Selenium + Karate en el Given</text></g><g data-motion-item="" data-step="5" aria-label="Etapa 4: siempre se ejecuta y junta los reportes"><rect x="520" y="212" width="240" height="80" rx="6" fill="#2d3142"/><rect x="520" y="212" width="240" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="640" y="258" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">4 · Resumen</text><text x="640" y="280" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reportes Karate + Cucumber</text></g><g data-motion-item="" data-step="6" aria-label="Resultado: verde o rojo; los omitidos no cuentan como fallas"><rect x="480" y="380" width="320" height="64" rx="32" fill="#2d3142"/><rect x="480" y="380" width="320" height="64" rx="32" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.05"/><text x="640" y="410" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Verde o rojo</text><text x="640" y="430" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">omitidos con su motivo</text></g><line x1="40" y1="468" x2="1240" y2="468" stroke="#f5f5f5" stroke-width="0.8" stroke-opacity="0.10"/><text x="40" y="496" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="140" y="484" width="28" height="16" rx="8" fill="#f5f5f5" stroke="#bfc0c0" fill-opacity="0.05"/><text x="180" y="497" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Inicio / fin</text><rect x="304" y="484" width="28" height="16" rx="3" fill="#393e53" stroke="#f5f5f5"/><text x="344" y="497" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Paso</text><polygon points="412,492 426,482 440,492 426,502" fill="#393e53" stroke="#f5f5f5"/><text x="452" y="497" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Decisión</text><rect x="548" y="484" width="28" height="16" rx="3" fill="#f08a59" stroke="#f08a59" fill-opacity="0.08"/><text x="588" y="497" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Etapa nueva: API</text>
