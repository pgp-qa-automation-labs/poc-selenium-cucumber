<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-etapas-fixture-title pipeline-etapas-fixture-desc" id="pipeline-etapas-fixture-dark-root">
        <title id="pipeline-etapas-fixture-title">Pipeline de fixtures en 4 etapas</title>
        <desc id="pipeline-etapas-fixture-desc">Compila, prueba la API con Karate y solo si responde bien ejecuta la UI con fixtures; el resumen siempre corre y junta los reportes de Karate y Cucumber.</desc>
        <defs>
      <style>#pipeline-etapas-fixture-dark-root { --color-paper: #2d3142;
      --color-ink: #f5f5f5;
      --color-muted: #bfc0c0;
      --color-soft: #949eb2;
      --color-accent: #f08a59;
      --color-rule: rgba(245,245,245,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 3600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1); }
      #pipeline-etapas-fixture-dark-root { color: var(--color-ink); font-family: var(--font-sans); }
      #pipeline-etapas-fixture-dark-root [data-motion-root] { width: min(100%, 1280px); }
      #pipeline-etapas-fixture-dark-root [data-motion-root] { max-width: 100%; min-width: 0; }
      #pipeline-etapas-fixture-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-etapas-fixture-dark-root .motion-ready [data-motion-item] { opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease); }
      #pipeline-etapas-fixture-dark-root .motion-ready [data-motion-item].is-visible, #pipeline-etapas-fixture-dark-root .motion-ready[data-frame="end"] [data-motion-item], #pipeline-etapas-fixture-dark-root .motion-ready[data-frame="static"] [data-motion-item] { opacity: 1;
      transform: none; }
      #pipeline-etapas-fixture-dark-root .draw-path { fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none; }
      #pipeline-etapas-fixture-dark-root .motion-ready .draw-path.is-visible { animation: draw-path var(--motion-step) linear forwards; }
      #pipeline-etapas-fixture-dark-root .flow-token { opacity: 0; pointer-events: none; }
      #pipeline-etapas-fixture-dark-root .motion-ready.is-playing .flow-token.is-visible { opacity: 1;
      animation: token-flow 3.2s linear 1 forwards; }
      #pipeline-etapas-fixture-dark-root .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible { animation-iteration-count: infinite; }
      #pipeline-etapas-fixture-dark-root to { stroke-dashoffset: 0; }
      #pipeline-etapas-fixture-dark-root 0% { transform: translateX(0); }
      #pipeline-etapas-fixture-dark-root 100% { transform: translateX(240px); }
      #pipeline-etapas-fixture-dark-root [data-motion-controls] { display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule); }
      #pipeline-etapas-fixture-dark-root .motion-ready [data-motion-controls] { display: flex; }
      #pipeline-etapas-fixture-dark-root [data-motion-controls][hidden] { display: none !important; }
      #pipeline-etapas-fixture-dark-root [data-motion-controls] button { min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer; }
      #pipeline-etapas-fixture-dark-root [data-motion-controls] button:hover { border-color: var(--color-accent); }
      #pipeline-etapas-fixture-dark-root [data-motion-controls] button:focus-visible { outline: 3px solid var(--color-accent);
      outline-offset: 2px; }
      #pipeline-etapas-fixture-dark-root [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
      #pipeline-etapas-fixture-dark-root [data-motion-status-visible] { margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono); }
      #pipeline-etapas-fixture-dark-root .sr-only { position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0; }
      #pipeline-etapas-fixture-dark-root noscript p { margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono); }
      #pipeline-etapas-fixture-dark-root html[data-motion="static"] [data-motion-controls], #pipeline-etapas-fixture-dark-root html[data-motion="static"] [data-motion-decorative] { display: none !important; }
      #pipeline-etapas-fixture-dark-root html[data-motion="static"] [data-motion-item] { opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important; }
      #pipeline-etapas-fixture-dark-root html[data-motion="step"] [data-motion-controls], #pipeline-etapas-fixture-dark-root html[data-motion="step"] [data-motion-decorative] { display: none !important; }
      #pipeline-etapas-fixture-dark-root html[data-motion="step"] [data-motion-item] { animation: none !important;
      transition: none !important; }
      #pipeline-etapas-fixture-dark-root [data-motion-item] { opacity: 1 !important; transform: none !important; }
      #pipeline-etapas-fixture-dark-root [data-motion-decorative] { display: none !important; }
      #pipeline-etapas-fixture-dark-root [data-motion-controls] { display: none !important; }
      #pipeline-etapas-fixture-dark-root .diagram-container { overflow-x: visible; }
      #pipeline-etapas-fixture-dark-root [data-motion-controls], #pipeline-etapas-fixture-dark-root [data-motion-decorative] { display: none !important; }
      #pipeline-etapas-fixture-dark-root [data-motion-item] { opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important; }
      #pipeline-etapas-fixture-dark-root .keyboard-help { color: var(--color-muted); font: 500 12px/1.4 var(--font-mono); }</style><marker id="pipeline-etapas-fixture-pipeline-etapas-fixture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="pipeline-etapas-fixture-pipeline-etapas-fixture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="pipeline-etapas-fixture-pipeline-etapas-fixture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker><marker id="pipeline-etapas-fixture-pipeline-etapas-fixture-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/></marker></defs>
