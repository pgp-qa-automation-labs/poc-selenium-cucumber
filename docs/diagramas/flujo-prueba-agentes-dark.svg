5f5" stroke-width="1"/><text x="360" y="92" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Preparar</text><text x="360" y="114" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">despertar API · Chrome</text><rect x="500" y="56" width="220" height="80" rx="6" fill="#2d3142"/><rect x="500" y="56" width="220" height="80" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1.2"/><text x="610" y="92" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Ejecutar los pasos</text><text x="610" y="114" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">self-healing si falla</text><polygon points="760,96 850,44 940,96 850,148" fill="#2d3142"/><polygon points="760,96 850,44 940,96 850,148" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="850" y="102" fill="#f5f5f5" font-size="15" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">¿Pasó?</text><rect x="980" y="64" width="260" height="64" rx="32" fill="#2d3142"/><rect x="980" y="64" width="260" height="64" rx="32" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="1"/><text x="1110" y="94" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Aprobado</text><text x="1110" y="114" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">guarda la línea base</text><text x="1110" y="152" fill="#949eb2" font-size="12" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">si pasó en el reintento: inestable</text