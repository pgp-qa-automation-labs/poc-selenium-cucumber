ll="#393e53" stroke="#f5f5f5"/><text x="336" y="513" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Paso</text><polygon points="400,508 414,498 428,508 414,518" fill="#393e53" stroke="#f5f5f5"/><text x="440" y="513" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Decisión</text><rect x="532" y="500" width="28" height="16" rx="3" fill="rgba(240,138,89,0.1)" stroke="#f08a59"/><text x="572" y="513" fill="#949eb2" font-size="11" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace">Usa IA (self-healing)</text></svg>
