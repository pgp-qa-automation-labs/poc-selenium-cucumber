<svg viewBox="0 0 1280 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-prueba-agentes-dark-title flujo-prueba-agentes-dark-desc"><title id="flujo-prueba-agentes-dark-title">Flujo de un escenario con reintento y evidencia</title><desc id="flujo-prueba-agentes-dark-desc">Cada escenario se ejecuta con self-healing; si pasa, guarda su línea base; si falla, guarda la evidencia y se reintenta una vez; si vuelve a fallar, queda fallido y pasa al agente de triage, y si pasa en el reintento se informa como inestable.</desc><defs><marker id="flujo-prueba-agentes-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="flujo-prueba-agentes-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="flujo-prueba-agentes-dark-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#bfc0c0"/></marker><marker id="flujo-prueba-agentes-dark-arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(245,245,245,0.45)"/></marker><pattern id="flujo-prueba-agentes-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.1)"/></pattern></defs><rect width="1280" height="540" fill="#2d3142"/><path d="M220 96 H260" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-prueba-agentes-dark-arrow)"/><path d="M460 96 H500" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-prueba-agentes-dark-arrow)"/><path d="M720 96 H760" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-prueba-agentes-dark-arrow)"/><path d="M940 96 H980" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#flujo-prueba-agentes-dark-arrow)"/><rect x="944" y="72" width="32" height="