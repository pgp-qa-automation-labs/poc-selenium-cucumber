name: E2E Selenium Cucumber

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: Ambiente
        type: choice
        options: [qa, prod]
        default: qa
      escenarios:
        description: Expresión de tags de Cucumber (ej. @ui-rota para correr una demo de triage)
        type: string
        default: not @self-healing and not @manual
      destino_issues:
        description: Dónde publicar los issues si el triage encuentra un problema
        type: choice
        options: [github, jira, azuredevops, todos, ninguno]
        default: github
      demo_self_healing:
        description: Ejecutar también la demo de self-healing (cambios de UI simulados, ~USD 0,10)
        type: boolean
        default: false
  # Ejecución diaria (lunes a viernes, 08:00 hora de Chile). GitHub solo la activa desde la rama principal del repo.
  schedule:
    - cron: '0 11 * * 1-5'

permissions:
  contents: read

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ${{ inputs.env || 'qa' }}
  ESCENARIOS: ${{ inputs.escenarios || 'not @self-healing and not @manual' }}
  PR_BRANCH: self-healing/correccion-locators
  RAMA_EVIDENCIAS: triage-evidencias
  # Los issues reales solo se crean fuera de PRs; dentro de un PR, o con destino 'ninguno', solo se genera la vista previa
  ISSUES_DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.destino_issues == 'ninguno' }}
  # Destino: el elegido al lanzar a mano; en ejecuciones automáticas, la variable del repo ISSUES_DESTINO o github
  ISSUES_DESTINO: ${{ inputs.destino_issues || vars.ISSUES_DESTINO || 'github' }}

jobs:
  # ───────────────────────────── Etapa 1 ─────────────────────────────
  compilar:
    name: 1 · Compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar entorno
        uses: ./.github/actions/preparar-entorno

      - name: Compilar framework y pruebas
        run: mvn -B -q test-compile

  # ───────────────────────────── Etapa 2 ─────────────────────────────
  regresion:
    name: 2 · Pruebas de regresión
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      hay_correcciones: ${{ steps.parche.outputs.hay_correcciones }}
      hay_evidencia: ${{ steps.evidencia.outputs.hay_evidencia }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar entorno
        uses: ./.github/actions/preparar-entorno

      - name: Despertar API del ambiente
        run: bash .github/scripts/warmup.sh "$TEST_ENV"

      # Aquí solo se prueba: cada escenario fallido se reintenta una vez y, si vuelve a fallar, se guarda su
      # paquete de evidencia (captura, HTML, consola, red). El diagnóstico es la etapa 3.
      # CI=true lo define GitHub Actions: ConfigReader fuerza headless automáticamente.
      - name: Ejecutar escenarios (con reintento y evidencia)
        run: >
          mvn -B test -Denv="$TEST_ENV"
          "-Dcucumber.filter.tags=$ESCENARIOS"
          -Dhealing.patchSources=true
          -Dtriage.enabled=false
          -Dissues.enabled=false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # para el self-healing; sin la key se desactiva solo

      - name: Generar parche de locators corregidos
        id: parche
        if: always()
        run: |
          mkdir -p target/healing
          git diff -- src/main/java > target/healing/locators.patch
          if [ -s target/healing/locators.patch ]; then
            echo "hay_correcciones=true" >> "$GITHUB_OUTPUT"
            echo "Se corrigieron locators en el código:"; git diff --stat -- src/main/java
          else
            echo "hay_correcciones=false" >> "$GITHUB_OUTPUT"
            echo "No hubo locators que corregir"
          fi

      - name: Detectar evidencia de fallos
        id: evidencia
        if: always()
        run: |
          if ls target/evidencia/*/estado.txt > /dev/null 2>&1; then
            echo "hay_evidencia=true" >> "$GITHUB_OUTPUT"
            echo "Escenarios con evidencia:"; grep -H . target/evidencia/*/estado.txt
          else
            echo "hay_evidencia=false" >> "$GITHUB_OUTPUT"
            echo "Ningún escenario falló"
          fi

      - name: Resumen de self-healing
        if: always()
        run: |
          if [ -f target/healing/healing-report.md ]; then
            cat target/healing/healing-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo -e "# Self-healing\n\nSin reparaciones: todos los locators funcionaron con su selector original." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-regresion
          path: |
            target/cucumber-reports/
            target/healing/
          if-no-files-found: ignore

      - name: Publicar paquetes de evidencia
        if: always() && steps.evidencia.outputs.hay_evidencia == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evidencia
          path: target/evidencia/

  demo-self-healing:
    name: 2 · Demo self-healing (UI simulada)
    needs: compilar
    # Es una demostración (no detecta cambios reales) y consume IA: solo corre si se pide al lanzar el workflow a mano
    if: github.event_name == 'workflow_dispatch' && inputs.demo_self_healing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar entorno
        uses: ./.github/actions/preparar-entorno

      - name: Despertar API del ambiente
        run: bash .github/scripts/warmup.sh "$TEST_ENV"

      - name: Ejecutar escenario con cambios de UI simulados
        run: mvn -B test -Denv="$TEST_ENV" "-Dcucumber.filter.tags=@ui-cambiada" -Dtriage.enabled=false -Dissues.enabled=false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Resumen de self-healing
        if: always()
        run: |
          if [ -f target/healing/healing-report.md ]; then cat target/healing/healing-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-demo-self-healing
          path: |
            target/cucumber-reports/
            target/healing/
          if-no-files-found: ignore

  # ───────────────────────────── Etapa 3 ─────────────────────────────
  pr-correccion:
    name: 3 · PR de corrección de locators
    needs: regresion
    # Solo si hubo correcciones reales y no estamos ya dentro de un PR
    if: needs.regresion.outputs.hay_correcciones == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.pr.outputs.pr_url }}
      gestores_tareas: ${{ steps.gestores.outputs.gestores_tareas }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Descargar parche y reporte
        uses: actions/download-artifact@v4
        with:
          name: reporte-regresion
          path: reporte

      - name: Aplicar corrección en una rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$PR_BRANCH"
          git apply reporte/healing/locators.patch
          git commit -am "Corrige locators detectados por self-healing"
          git push --force origin "$PR_BRANCH"

      - name: Crear o actualizar Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          if gh pr view "$PR_BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$PR_BRANCH" --body-file reporte/healing/pr-body.md
            echo "PR existente actualizado: $(gh pr view "$PR_BRANCH" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base "$BASE" --head "$PR_BRANCH" \
              --title "Self-healing: corrección de locators" \
              --body-file reporte/healing/pr-body.md
            echo "PR creado: $(gh pr view "$PR_BRANCH" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "pr_url=$(gh pr view "$PR_BRANCH" --json url -q .url)" >> "$GITHUB_OUTPUT"

      # Las reparaciones también se informan como tarea de mantenimiento en Jira y Azure DevOps (si se eligieron);
      # en GitHub no hace falta: el PR ya registra el trabajo.
      - name: Decidir tareas de mantenimiento
        id: gestores
        run: |
          case "$ISSUES_DESTINO" in
            jira)        g='[{"id":"jira","nombre":"Jira"}]' ;;
            azuredevops) g='[{"id":"azuredevops","nombre":"Azure DevOps"}]' ;;
            todos|ninguno) g='[{"id":"jira","nombre":"Jira"},{"id":"azuredevops","nombre":"Azure DevOps"}]' ;;
            *)           g='[]' ;;
          esac
          echo "gestores_tareas=$g" >> "$GITHUB_OUTPUT"
          echo "Tareas de mantenimiento en: $g"

  triage:
    name: 3 · Evaluación de triage
    needs: regresion
    # Corre aunque la regresión falle (justamente cuando hay evidencia), pero no si se canceló
    if: always() && needs.regresion.result != 'cancelled' && needs.regresion.outputs.hay_evidencia == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # solo para subir las capturas a la rama de evidencias
    outputs:
      hay_diagnosticos: ${{ steps.resultado.outputs.hay_diagnosticos }}
      gestores: ${{ steps.resultado.outputs.gestores }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar entorno
        uses: ./.github/actions/preparar-entorno

      - name: Descargar evidencia de la regresión
        uses: actions/download-artifact@v4
        with:
          name: evidencia
          path: evidencia

      # Carpeta legible para las capturas de esta ejecución: <fecha>_run-<número>_<rama>.
      # Se define antes del triage para que los issues apunten a la URL donde quedará cada imagen.
      - name: Definir carpeta de evidencias
        run: |
          carpeta="$(date -u +%F)_run-${GITHUB_RUN_NUMBER}_${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          carpeta="${carpeta//\//-}"
          echo "CARPETA_EVIDENCIAS=$carpeta" >> "$GITHUB_ENV"
          echo "EVIDENCIAS_URL_BASE=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RAMA_EVIDENCIAS}/$carpeta" >> "$GITHUB_ENV"
          echo "Carpeta de evidencias: $carpeta"

      # Descarta los inestables, agrupa los fallos con la misma causa, respeta el tope de investigaciones
      # y el agente investiga un escenario por grupo. Cada investigación es una sección plegable del log.
      - name: Investigar fallos con el agente
        run: >
          mvn -B test-compile exec:java
          -Dexec.mainClass=cl.guzman.automation.triage.EvaluarTriage
          -Dexec.args=evidencia
          -Denv="$TEST_ENV"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publicar capturas en la rama de evidencias
        if: hashFiles('target/triage/capturas/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publicar-evidencias.sh

      - name: Decidir publicación
        id: resultado
        if: always()
        run: |
          if [ -f target/triage/triage-report.json ]; then
            echo "hay_diagnosticos=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_diagnosticos=false" >> "$GITHUB_OUTPUT"
          fi
          case "$ISSUES_DESTINO" in
            github)      g='[{"id":"github","nombre":"GitHub"}]' ;;
            jira)        g='[{"id":"jira","nombre":"Jira"}]' ;;
            azuredevops) g='[{"id":"azuredevops","nombre":"Azure DevOps"}]' ;;
            *)           g='[{"id":"github","nombre":"GitHub"},{"id":"jira","nombre":"Jira"},{"id":"azuredevops","nombre":"Azure DevOps"}]' ;;
          esac
          echo "gestores=$g" >> "$GITHUB_OUTPUT"
          echo "Destino de los issues: $ISSUES_DESTINO (dry-run: $ISSUES_DRY_RUN)"

      - name: Resumen del triage
        if: always()
        run: |
          if [ -f target/triage/triage-report.md ]; then cat target/triage/triage-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publicar diagnósticos y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage
          path: target/triage/
          if-no-files-found: ignore

  # ───────────────────────────── Etapa 4 ─────────────────────────────
  issues:
    name: 4 · Issue en ${{ matrix.nombre }}
    needs: triage
    if: always() && needs.triage.outputs.hay_diagnosticos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Una ejecución por gestor elegido; si uno falla, los demás siguen
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.triage.outputs.gestores || '[{"id":"github","nombre":"GitHub"}]') }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar entorno
        uses: ./.github/actions/preparar-entorno

      - name: Descargar diagnósticos del triage
        uses: actions/download-artifact@v4
        with:
          name: triage
          path: triage

      # Sin credenciales del gestor, solo genera la vista previa (no falla)
      - name: Publicar issue en ${{ matrix.nombre }}
        run: >
          mvn -B test-compile exec:java
          -Dexec.mainClass=cl.guzman.automation.issues.PublicarIssues
          -Dexec.args=triage/triage-report.json
          -Denv="$TEST_ENV"
          -Dissues.tracker=${{ matrix.id }}
          -Dissues.dryRun=$ISSUES_DRY_RUN
          "-Dissues.jiraBaseUrl=${{ vars.JIRA_BASE_URL }}"
          "-Dissues.jiraProjectKey=${{ vars.JIRA_PROJECT_KEY }}"
          "-Dissues.azureOrgUrl=${{ vars.AZURE_DEVOPS_ORG_URL }}"
          "-Dissues.azureProject=${{ vars.AZURE_DEVOPS_PROJECT }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}

      - name: Resumen
        if: always()
        run: |
          for reporte in target/issues/*/issues-report.md; do
            if [ -f "$reporte" ]; then cat "$reporte" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Publicar vista previa y payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issues-${{ matrix.id }}
          path: target/issues/
          if-no-files-found: ignore

  tareas:
    name: 4 · Tarea en ${{ matrix.nombre }}
    needs: pr-correccion
    if: needs.pr-correccion.result == 'success' && needs.pr-correccion.outputs.gestores_tareas != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pr-correccion.outputs.gestores_tareas || '[]') }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar entorno
        uses: ./.github/actions/preparar-entorno

      - name: Descargar reporte de self-healing
        uses: actions/download-artifact@v4
        with:
          name: reporte-regresion
          path: reporte

      # Sin credenciales del gestor, solo genera la vista previa (no falla)
      - name: Publicar tarea en ${{ matrix.nombre }}
        run: >
          mvn -B test-compile exec:java
          -Dexec.mainClass=cl.guzman.automation.issues.PublicarTareas
          -Dexec.args=reporte/healing/healing-report.json
          -Denv="$TEST_ENV"
          -Dissues.tracker=${{ matrix.id }}
          -Dissues.dryRun=$ISSUES_DRY_RUN
          "-Dissues.jiraBaseUrl=${{ vars.JIRA_BASE_URL }}"
          "-Dissues.jiraProjectKey=${{ vars.JIRA_PROJECT_KEY }}"
          "-Dissues.azureOrgUrl=${{ vars.AZURE_DEVOPS_ORG_URL }}"
          "-Dissues.azureProject=${{ vars.AZURE_DEVOPS_PROJECT }}"
        env:
          PR_URL: ${{ needs.pr-correccion.outputs.pr_url }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}

      - name: Resumen
        if: always()
        run: |
          for reporte in target/issues/*/issues-report.md; do
            if [ -f "$reporte" ]; then cat "$reporte" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Publicar vista previa y payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tareas-${{ matrix.id }}
          path: target/issues/
          if-no-files-found: ignore
